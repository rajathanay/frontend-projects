<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JavaScript To-Do List</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="todo-container">

        <h1>My To-Do List</h1>

        <!-- Task Input -->
        <div class="input-section">

            <input
                type="text"
                id="task-input"
                placeholder="Enter a task"
            >

            <button id="add-task">
                Add Task
            </button>

        </div>


        <!-- Validation Message -->
        <p id="error-message"></p>


        <!-- Filter Buttons -->
        <div class="filters">

            <button
                class="filter-btn active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="active"
            >
                Active
            </button>

            <button
                class="filter-btn"
                data-filter="completed"
            >
                Completed
            </button>

        </div>


        <!-- Task List -->
        <ul id="task-list"></ul>


        <!-- Footer Information -->
        <div class="task-footer">

            <p id="task-count">
                0 tasks remaining
            </p>

            <button id="clear-completed">
                Clear Completed
            </button>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
