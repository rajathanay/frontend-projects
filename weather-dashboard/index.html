<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Weather dashboard showing current weather and a five-day forecast."
    >

    <title>SkyCast Weather</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <main class="weather-app">

        <header class="app-header">
            <p class="eyebrow">Local Weather</p>

            <h1>SkyCast</h1>

            <p>
                Search a city or use your current location
                to check the weather.
            </p>
        </header>


        <section class="search-card">

            <form id="search-form">

                <label for="city-input">
                    City
                </label>

                <div class="search-row">

                    <input
                        type="text"
                        id="city-input"
                        placeholder="Example: Chicago"
                        autocomplete="off"
                        required
                    >

                    <button type="submit">
                        Search
                    </button>

                </div>

            </form>


            <button
                type="button"
                id="location-button"
                class="location-button"
            >
                Use My Location
            </button>

        </section>


        <p
            id="status-message"
            class="status-message"
            aria-live="polite"
        >
            Search for a city to get started.
        </p>


        <section
            id="current-weather"
            class="current-weather"
            hidden
        >

            <div class="current-header">

                <div>
                    <p class="section-label">
                        Current Weather
                    </p>

                    <h2 id="city-name"></h2>

                    <p id="weather-date"></p>
                </div>


                <img
                    id="weather-icon"
                    src=""
                    alt=""
                >

            </div>


            <div class="main-weather">

                <div>
                    <p
                        id="temperature"
                        class="temperature"
                    >
                    </p>

                    <p
                        id="weather-description"
                        class="description"
                    >
                    </p>
                </div>

            </div>


            <div class="weather-details">

                <article>
                    <span>Feels Like</span>
                    <strong id="feels-like"></strong>
                </article>

                <article>
                    <span>Humidity</span>
                    <strong id="humidity"></strong>
                </article>

                <article>
                    <span>Wind</span>
                    <strong id="wind-speed"></strong>
                </article>

                <article>
                    <span>Pressure</span>
                    <strong id="pressure"></strong>
                </article>

            </div>

        </section>


        <section
            id="forecast-section"
            class="forecast-section"
            hidden
        >

            <div class="forecast-heading">

                <div>
                    <p class="section-label">
                        Forecast
                    </p>

                    <h2>
                        Next 5 Days
                    </h2>
                </div>

            </div>


            <div
                id="forecast-container"
                class="forecast-grid"
            >
            </div>

        </section>

    </main>


    <footer>
        <p>
            Weather data provided by OpenWeatherMap
        </p>
    </footer>


    <script src="js/script.js"></script>

</body>

</html>
