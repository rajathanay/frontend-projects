<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Accessible multi-step registration form with personal information, address, education, review, and validation."
    >

    <meta
        name="author"
        content="Thanay"
    >

    <title>Multi-Step Registration Form</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <header>

        <h1>
            Registration Form
        </h1>

        <p>
            Complete all steps to finish your registration.
        </p>

    </header>

    <main>

        <section
            class="progress-section"
            aria-label="Registration progress"
        >

            <p
                id="progress-text"
                aria-live="polite"
            >
                Step 1 of 4
            </p>


            <progress
                id="progress-bar"
                value="1"
                max="4"
            >
                25%
            </progress>

        </section>


        <form id="registration-form">


            <fieldset
                class="form-step active"
                data-step="1"
            >

                <legend>
                    Step 1: Personal Information
                </legend>


                <div class="form-group">

                    <label for="first-name">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="first-name"
                        name="firstName"
                        minlength="2"
                        autocomplete="given-name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="last-name">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="last-name"
                        name="lastName"
                        minlength="2"
                        autocomplete="family-name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        pattern="[0-9]{10}"
                        placeholder="10 digit phone number"
                        autocomplete="tel"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="dob">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                        name="dateOfBirth"
                        required
                    >

                </div>


                <div class="form-navigation">

                    <button
                        type="button"
                        class="next-button"
                    >
                        Next
                    </button>

                </div>

            </fieldset>

            <fieldset
                class="form-step"
                data-step="2"
            >

                <legend>
                    Step 2: Address
                </legend>


                <div class="form-group">

                    <label for="address">
                        Street Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        name="address"
                        autocomplete="street-address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        autocomplete="address-level2"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="state">
                        State
                    </label>

                    <input
                        type="text"
                        id="state"
                        name="state"
                        autocomplete="address-level1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="zip">
                        ZIP Code
                    </label>

                    <input
                        type="text"
                        id="zip"
                        name="zipCode"
                        pattern="[0-9]{5}"
                        placeholder="5 digit ZIP code"
                        autocomplete="postal-code"
                        required
                    >

                </div>


                <div class="form-navigation">

                    <button
                        type="button"
                        class="previous-button"
                    >
                        Previous
                    </button>


                    <button
                        type="button"
                        class="next-button"
                    >
                        Next
                    </button>

                </div>

            </fieldset>


            <fieldset
                class="form-step"
                data-step="3"
            >

                <legend>
                    Step 3: Education
                </legend>


                <div class="form-group">

                    <label for="degree">
                        Highest Degree
                    </label>

                    <select
                        id="degree"
                        name="degree"
                        required
                    >

                        <option value="">
                            Select Degree
                        </option>

                        <option value="High School">
                            High School
                        </option>

                        <option value="Associate Degree">
                            Associate Degree
                        </option>

                        <option value="Bachelor's Degree">
                            Bachelor's Degree
                        </option>

                        <option value="Master's Degree">
                            Master's Degree
                        </option>

                        <option value="Doctorate">
                            Doctorate
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="institution">
                        Institution Name
                    </label>

                    <input
                        type="text"
                        id="institution"
                        name="institution"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="graduation-year">
                        Graduation Year
                    </label>

                    <input
                        type="number"
                        id="graduation-year"
                        name="graduationYear"
                        min="1950"
                        max="2035"
                        required
                    >

                </div>


                <div class="form-navigation">

                    <button
                        type="button"
                        class="previous-button"
                    >
                        Previous
                    </button>


                    <button
                        type="button"
                        class="next-button"
                    >
                        Next
                    </button>

                </div>

            </fieldset>


            <fieldset
                class="form-step"
                data-step="4"
            >

                <legend>
                    Step 4: Review and Submit
                </legend>


                <p>
                    Review your information before
                    submitting the registration form.
                </p>


                <div
                    id="review-section"
                    aria-live="polite"
                >
                </div>


                <div class="form-group checkbox-group">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <label for="terms">
                        I confirm that the information
                        provided is correct.
                    </label>

                </div>


                <div class="form-navigation">

                    <button
                        type="button"
                        class="previous-button"
                    >
                        Previous
                    </button>


                    <button
                        type="submit"
                        class="submit-button"
                    >
                        Submit Registration
                    </button>

                </div>

            </fieldset>

        </form>


        <div
            id="success-message"
            role="status"
            aria-live="polite"
            hidden
        >

            Registration completed successfully.

        </div>

    </main>

    <script src="js/script.js"></script>


</body>

</html>
