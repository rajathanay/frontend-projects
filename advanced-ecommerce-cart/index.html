<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Simple e-commerce cart with dynamic pricing, coupons and cart persistence."
    >

    <title>ShopFlow</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header class="site-header">

        <div class="header-inner">

            <a
                href="#"
                class="logo"
            >
                ShopFlow
            </a>

            <button
                type="button"
                id="cart-toggle"
                class="cart-toggle"
            >
                Cart
                <span id="cart-count">0</span>
            </button>

        </div>

    </header>


    <main class="page">

        <section class="intro">

            <p class="eyebrow">
                Everyday Store
            </p>

            <h1>
                Simple products. Simple cart.
            </h1>

            <p>
                Add products to your cart, change quantities,
                apply a discount and come back later without
                losing your cart.
            </p>

        </section>


        <p
            id="status-message"
            class="status-message"
            aria-live="polite"
        >
        </p>


        <section>

            <div class="section-heading">

                <h2>
                    Products
                </h2>

                <span id="product-count"></span>

            </div>


            <div
                id="product-grid"
                class="product-grid"
            >
            </div>

        </section>

    </main>


    <!-- Mini cart -->

    <div
        id="cart-overlay"
        class="cart-overlay"
    >
    </div>


    <aside
        id="cart-panel"
        class="cart-panel"
        aria-hidden="true"
    >

        <div class="cart-header">

            <div>
                <p class="eyebrow">
                    Your Cart
                </p>

                <h2>
                    Shopping Cart
                </h2>
            </div>


            <button
                type="button"
                id="cart-close"
                class="close-button"
                aria-label="Close cart"
            >
                ×
            </button>

        </div>


        <div
            id="cart-items"
            class="cart-items"
        >
        </div>


        <p
            id="empty-cart"
            class="empty-cart"
        >
            Your cart is empty.
        </p>


        <section class="coupon-section">

            <form id="coupon-form">

                <label for="coupon-input">
                    Coupon
                </label>

                <div class="coupon-row">

                    <input
                        type="text"
                        id="coupon-input"
                        placeholder="Example: SAVE10"
                        autocomplete="off"
                    >

                    <button type="submit">
                        Apply
                    </button>

                </div>

            </form>


            <p
                id="coupon-message"
                class="coupon-message"
            >
            </p>

        </section>


        <div class="cart-summary">

            <div>
                <span>Subtotal</span>
                <strong id="subtotal">$0.00</strong>
            </div>

            <div>
                <span>Discount</span>
                <strong id="discount">$0.00</strong>
            </div>

            <div class="total-row">
                <span>Total</span>
                <strong id="total">$0.00</strong>
            </div>

        </div>


        <button
            type="button"
            id="clear-cart"
            class="clear-cart"
        >
            Clear Cart
        </button>

    </aside>


    <script src="js/script.js"></script>

</body>

</html>
